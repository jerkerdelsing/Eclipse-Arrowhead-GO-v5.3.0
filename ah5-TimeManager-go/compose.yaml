# Standalone service template; join the target cloud network via ARROWHEAD_NETWORK.
services:
  system:
    image: eclipse-arrowhead/timemanager-go:5.2.2
    build:
      context: .
    user: "${ARROWHEAD_UID:?Run make prepare}:${ARROWHEAD_GID:?Run make prepare}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${HOST_PORT:-8463}:8463"
    volumes:
      - ./config:/config:ro
      - ./certs:/certs:ro
      - ./secrets:/secrets:ro
      - ./state:/state
    networks:
      arrowhead:
        aliases: [timemanager]
networks:
  arrowhead:
    external: true
    name: ${ARROWHEAD_NETWORK:?Set the existing target cloud network}
