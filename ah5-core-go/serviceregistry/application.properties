# Arrowhead 5.2.2 ServiceRegistry (Go) - sample configuration.
# Every property can also be set through an environment variable (dots/dashes -> underscores, upper case),
# e.g. SERVER_PORT=8443 DOMAIN_NAME=sr.example.org.
server.address=0.0.0.0
server.port=8443
domain.name=127.0.0.1

# declared | certificate | outsourced   (certificate requires server.ssl.enabled=true)
authentication.policy=declared

server.ssl.enabled=false
#server.ssl.cert-file=certs/serviceregistry.crt.pem
#server.ssl.key-file=certs/serviceregistry.key.pem
#server.ssl.trust-file=certs/truststore.pem
#server.ssl.client-auth=need
#server.common.name=serviceregistry.testcloud.aitia.arrowhead.eu

enable.management.filter=false
# sysop-only | whitelist | authorization
management.policy=sysop-only
management.whitelist=
enable.blacklist.filter=false
force.blacklist.filter=true
blacklist.check.exclude.list=ServiceRegistry

# open | restricted
service.discovery.policy=restricted
service.discovery.direct.access=
discovery.verbose=false
# open | extendable | restricted
service.discovery.interface.policy=restricted
allow.self.addressing=true
allow.non.routable.addressing=true
service.address.alias=address,addresses,accessAddress,accessAddresses,host,hosts
max.page.size=1000
normalization.mode=extended

# JSON snapshot file used for persistence (empty = memory only)
data.file=/state/serviceregistry.json
log.buffer.size=5000
log.all.request.and.response=false
standalone.mode=false
http.client.socket.timeout=30000
