# ColonyOS stack of LocalCloudConfigurator: TimescaleDB, the Colonies server and the configurator API/UI.
# The cloud executor runs on the cloud host (make executor), because it drives that host's docker compose and the
# cloud's scripts. All ports are published on loopback only. Secrets: make keygen (files in ./secrets, mode 0600).
name: lcc-colonyos

secrets:
  colonies_db_password: { file: ./secrets/colonies_db_password }
  colonies_server_id: { file: ./secrets/colonies_server_id }
  lcc_api_prvkey: { file: ./secrets/lcc_api_prvkey }
  lcc_api_token: { file: ./secrets/lcc_api_token }

services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/colonies_db_password
      TS_TUNE_MAX_CONNS: "200"
    secrets: [colonies_db_password]
    volumes: [timescaledb-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  colonies-server:
    image: colonyos/colonies:v1.9.10
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
    secrets: [colonies_db_password, colonies_server_id]
    environment:
      COLONIES_TLS: "false"
      COLONIES_SERVER_PORT: "50080"
      COLONIES_DB_HOST: timescaledb
      COLONIES_DB_PORT: "5432"
      COLONIES_DB_USER: postgres
      COLONIES_DB_TIMESCALEDB: "true"
      COLONIES_ALLOW_EXECUTOR_REREGISTER: "false"
      COLONIES_EXCLUSIVE_ASSIGN: "true"
      COLONIES_RETENTION: "false"
      COLONIES_CRON_CHECKER_PERIOD: "1000"
      COLONIES_GENERATOR_CHECKER_PERIOD: "500"
      COLONIES_VERBOSE: "false"
      TZ: Europe/Stockholm
    # Secrets as files: the server reads them from its environment, so they are exported only inside this shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        COLONIES_DB_PASSWORD=$$(cat /run/secrets/colonies_db_password)
        COLONIES_SERVER_ID=$$(cat /run/secrets/colonies_server_id)
        exec colonies server start --initdb --port 50080 --relayport 25100 --etcdname server1
        --etcdhost colonies-server --etcdclientport 23100 --etcdpeerport 24100
        --initial-cluster server1=colonies-server:24100:25100:50080 --etcddatadir /var/colonies/etcd --insecure
    volumes: [colonies-etcd:/var/colonies/etcd]
    ports: ["127.0.0.1:50080:50080"]

  localcloudconfigurator:
    image: eclipse-arrowhead/localcloudconfigurator-go:5.4.0
    build: { context: ../.. }
    restart: unless-stopped
    depends_on: [colonies-server]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 64
    secrets: [lcc_api_prvkey, lcc_api_token]
    environment:
      COLONIES_SERVER_HOST: colonies-server
      COLONIES_SERVER_PORT: "50080"
      COLONIES_TLS: "false"
      COLONIES_COLONY_NAME: ${LCC_COLONY:-arrowhead}
      COLONIES_PRVKEY_FILE: /run/secrets/lcc_api_prvkey
      LCC_API_TOKEN_FILE: /run/secrets/lcc_api_token
    ports: ["127.0.0.1:8095:8095"]

volumes:
  timescaledb-data:
  colonies-etcd:

networks:
  default:
    # Explicit subnet: the Docker Desktop default address pools are used up on the test host.
    ipam:
      config:
        - subnet: ${LCC_SUBNET:-10.240.90.0/24}
